# Build Raven for Linux (AppImage), Windows (NSIS installer) and macOS (dmg).
# PyInstaller cannot build for another OS, so each OS builds its own sidecar.
# It runs on a version tag (v0.3.0) or by hand (Actions, Build, Run workflow). A normal push does not run it.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sidecar (PyInstaller, its own Python)
        working-directory: core
        run: |
          uv sync --dev
          uv run pyinstaller packaging/raven-core.spec --noconfirm --distpath dist --workpath build

      # The tests use Linux paths and the FreeDesktop trash. Windows and macOS are not tested yet.
      - name: Sidecar tests
        if: runner.os == 'Linux'
        working-directory: core
        run: uv run pytest -q

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: App
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit -p tsconfig.json
          pnpm exec electron-vite build
          pnpm exec electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: raven-${{ matrix.os }}
          path: |
            app/release/*.AppImage
            app/release/*.exe
            app/release/*.dmg
          if-no-files-found: error
