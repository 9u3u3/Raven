name: publish

# Copies the builds of one build.yml run to a release in 9u3u3/ravenfiles, on the GitHub servers.
# It needs the secret RAVENFILES_TOKEN: a token with "Contents: read and write" on 9u3u3/ravenfiles only.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The build.yml run that has the builds
        required: true
      tag:
        description: The release tag in 9u3u3/ravenfiles
        required: true

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: raven-*
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Check the sums
        working-directory: dist
        run: |
          ls -la
          sha256sum -c SHA256SUMS.txt

      - name: Upload to the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.RAVENFILES_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" *.AppImage *.exe SHA256SUMS.txt --repo 9u3u3/ravenfiles --clobber
          gh release view "${{ inputs.tag }}" --repo 9u3u3/ravenfiles --json assets --jq '.assets[] | "\(.name) \(.size) \(.digest)"'
