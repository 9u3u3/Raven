[project]
name = "raven-core"
version = "0.1.0"
description = "Raven core: the local sidecar for file, index, AI and privacy work"
authors = [
    { name = "HarshF40", email = "harshgaonkar57@gmail.com" }
]
requires-python = ">=3.12"
license = { file = "../LICENSE" }
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "blake3>=1.0.11",
    "fastapi>=0.143.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "markitdown[docx,pptx,xlsx]>=0.1.8",
    "mcp>=2.3.0",
    "model2vec>=0.6",
    "onnxruntime>=1.22",
    "pillow>=12.3.0",
    "platformdirs>=4.13.0",
    "pymupdf>=1.28.2",
    "rapidfuzz>=3.14.6",
    "sqlcipher3-wheels>=0.5.7",
    "sqlite-vec>=0.1.9",
    "tokenizers>=0.23.3",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
    "xxhash>=4.0.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
