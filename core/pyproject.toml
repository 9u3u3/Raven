[project]
name = "raven-core"
version = "0.3.0-beta.3"
description = "Raven core: the local sidecar for file, index, AI and privacy work"
authors = [
    { name = "9u3u3", email = "harshgaonkar57@gmail.com" }
]
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "anthropic>=1.15.0",
    "blake3>=1.0.11",
    "fastapi>=0.143.1",
    "faster-whisper>=1.2.1",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "markitdown[docx,pptx,xlsx]>=0.1.8",
    "mcp>=2.3.0",
    "model2vec>=0.6",
    "onnxruntime>=1.22",
    "pikepdf>=10.17.0",
    "pillow>=12.3.0",
    "platformdirs>=4.13.0",
    "psutil>=7.2.2",
    "pypdfium2>=5.14.0",
    "rapidfuzz>=3.14.6",
    "sqlcipher3-wheels>=0.5.7",
    "sqlite-vec>=0.1.9",
    "tokenizers>=0.23.3",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
    "xxhash>=4.0.1",
    "zstandard>=0.25.0",
]

[project.scripts]
raven = "raven_core.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
