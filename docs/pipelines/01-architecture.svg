="340" width="5" height="110" fill="#b48ead"/><text x="1218" y="368" font-size="18" font-weight="bold" fill="#e3e5e8">Ollama (GPU)</text><text x="1218" y="392" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">embeddinggemma · qwen3:4b</text><rect x="1200" y="490" width="340" height="110" fill="#1d2024" stroke="#b48ead" stroke-width="2"/><rect x="1200" y="490" width="5" height="110" fill="#b48ead"/><text x="1218" y="518" font-size="18" font-weight="bold" fill="#e3e5e8">ONNX / CTranslate2 (CPU)</text><text x="1218" y="542" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">SigLIP 2 · MiniLM · Privacy Filter</text><text x="1218" y="563" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">Whisper base</text><rect x="1200" y="680" width="340" height="120" fill="#1d2024" stroke="#8dbf93" stroke-width="2"/><rect x="1200" y="680" width="5" height="120" fill="#8dbf93"/><text x="1218" y="708" font-size="18" font-weight="bold" fill="#e3e5e8">Cloud (optional)</text><text x="1218" y="732" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">Groq · Anthropic · claude -p</text><text x="1218" y="753" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">only after redaction</text><rect x="500" y="700" width="330" height="100" fill="#1d2024" stroke="#c9ccd1" stroke-width="2"/><rect x="500" y="700" width="5" height="100" fill="#c9ccd1"/><text x="518" y="728" font-size="18" font-weight="bold" fill="#e3e5e8">MCP clients</text><text x="518" y="752" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">Claude Desktop · Cursor · Zed</text><rect x="379" y="314" width="136" height="22" fill="#17191c"/><text x="447" y="330" text-anchor="middle" font-size="13.5" fill="#7fa8d6">HTTP + WebSocket</text><rect x="394" y="420" width="105" height="22" fill="#17191c"/><text x="447" y="436" text-anchor="middle" font-size="13.5" fill="#7fa8d6">spawn, watch</text><rect x="1070" y="562" width="120" height="22" fill="#17191c"/><text x="1130" y="578" text-anchor="middle" font-size="13.5" fill="#e5736a">redaction gate</text><rect x="789" y="737" width="113" height="22" fill="#17191c"/><text x="845" y="753" text-anchor="middle" font-size="13.5" fill="#7fa8d6">stdio adapter</text><text x="64" y="600" font-size="15" fill="#e5736a" text-anchor="start">The renderer never reaches the network:</text><text x="64" y="622" font-size="15" fill="#e5736a" text-anchor="start">every non-loopback request is cancelled.</text>
