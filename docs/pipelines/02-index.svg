<rect x="64" y="170" width="300" height="160" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="64" y="170" width="5" height="160" fill="#7fa8d6"/><text x="82" y="198" font-size="18" font-weight="bold" fill="#e3e5e8">Walk the roots</text><text x="82" y="222" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">skip: .ssh, caches, SDKs,</text><text x="82" y="243" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">node_modules, datasets</text><text x="82" y="264" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">code projects: names only</text><text x="82" y="285" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">UPSERT only when changed</text><rect x="64" y="400" width="300" height="110" fill="#1d2024" stroke="#d9b26a" stroke-width="2"/><rect x="64" y="400" width="5" height="110" fill="#d9b26a"/><text x="82" y="428" font-size="18" font-weight="bold" fill="#e3e5e8">A · Names</text><text x="82" y="452" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">files table: size, times,</text><text x="82" y="473" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">kind (magic bytes)</text><rect x="64" y="590" width="300" height="120" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="64" y="590" width="5" height="120" fill="#7fa8d6"/><text x="82" y="618" font-size="18" font-weight="bold" fill="#e3e5e8">Watcher</text><text x="82" y="642" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">inotify (local)</text><text x="82" y="663" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">poll every 30 s (shares)</text><rect x="440" y="170" width="330" height="160" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="440" y="170" width="5" height="160" fill="#7fa8d6"/><text x="458" y="198" font-size="18" font-weight="bold" fill="#e3e5e8">B · Extract text</text><text x="458" y="222" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">PDF (PyMuPDF, one lock)</text><text x="458" y="243" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">OCR scans (tesseract)</text><text x="458" y="264" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">DOCX/PPTX/XLSX, ODF, EPUB</text><text x="458" y="285" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">camera photos: no OCR</text><rect x="440" y="400" width="330" height="140" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="440" y="400" width="5" height="140" fill="#7fa8d6"/><text x="458" y="428" font-size="18" font-weight="bold" fill="#e3e5e8">Chunk</text><text x="458" y="452" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">~350 tokens, 50 overlap</text><text x="458" y="473" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">header: File | Folder |</text><text x="458" y="494" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">Title | Section</text><rect x="440" y="610" width="330" height="110" fill="#1d2024" stroke="#e5736a" stroke-width="2"/><rect x="440" y="610" width="5" height="110" fill="#e5736a"/><text x="458" y="638" font-size="18" font-weight="bold" fill="#e3e5e8">PII layer 1</text><text x="458" y="662" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">spans per chunk</text><text x="458" y="683" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">file PII level 0 / 1 / 2</text><rect x="850" y="170" width="330" height="140" fill="#1d2024" stroke="#b48ead" stroke-width="2"/><rect x="850" y="170" width="5" height="140" fill="#b48ead"/><text x="868" y="198" font-size="18" font-weight="bold" fill="#e3e5e8">C · Meaning</text><text x="868" y="222" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">embeddinggemma (Ollama)</text><text x="868" y="243" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">batches of 48 · 768-d</text><text x="868" y="264" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">lite: potion on the CPU</text><rect x="850" y="380" width="330" height="120" fill="#1d2024" stroke="#d9b26a" stroke-width="2"/><rect x="850" y="380" width="5" height="120" fill="#d9b26a"/><text x="868" y="408" font-size="18" font-weight="bold" fill="#e3e5e8">Stores</text><text x="868" y="432" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">FTS5 (BM25) · sqlite-vec</text><text x="868" y="453" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">binary copies ≥ 50k chunks</text><rect x="1260" y="170" width="280" height="150" fill="#1d2024" stroke="#b48ead" stroke-width="2"/><rect x="1260" y="170" width="5" height="150" fill="#b48ead"/><text x="1278" y="198" font-size="18" font-weight="bold" fill="#e3e5e8">D · Images</text><text x="1278" y="222" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">SigLIP 2: photos,</text><text x="1278" y="243" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">PDF pages, video</text><text x="1278" y="264" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">keyframes + time</text><rect x="1260" y="360" width="280" height="130" fill="#1d2024" stroke="#b48ead" stroke-width="2"/><rect x="1260" y="360" width="5" height="130" fill="#b48ead"/><text x="1278" y="388" font-size="18" font-weight="bold" fill="#e3e5e8">E · Speech</text><text x="1278" y="412" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">Whisper base int8</text><text x="1278" y="433" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">timed 90-word chunks</text><rect x="1260" y="530" width="280" height="130" fill="#1d2024" stroke="#b48ead" stroke-width="2"/><rect x="1260" y="530" width="5" height="130" fill="#b48ead"/><text x="1278" y="558" font-size="18" font-weight="bold" fill="#e3e5e8">F · Categories</text><text x="1278" y="582" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">rules → examples →</text><text x="1278" y="603" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">prototypes → local LLM</text><rect x="850" y="570" width="330" height="140" fill="#1d2024" stroke="#b48ead" stroke-width="2"/><rect x="850" y="570" width="5" height="140" fill="#b48ead"/><text x="868" y="598" font-size="18" font-weight="bold" fill="#e3e5e8">Folders</text><text x="868" y="622" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">profile + 2-sentence</text><text x="868" y="643" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">summary (local LLM)</text><text x="868" y="664" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">+ mean vector</text><text x="64" y="790" font-size="16" fill="#7fa8d6" text-anchor="start">Interactive requests come first: an Ask or a search pauses the background batch at once.</text><text x="64" y="815" font-size="15" fill="#8f949c" text-anchor="start">Real home folder: text work cut from 581,790 files to about 5,500 by the skip rules. Rescan of an unchanged disk: 36 s.</text>
</svg>
