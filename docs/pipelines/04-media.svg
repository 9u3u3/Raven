<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="DejaVu Sans, Noto Sans, sans-serif">
<defs>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#2a2e34"/></pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker>
</defs>
<rect width="1600" height="900" fill="#17191c"/><rect width="1600" height="900" fill="url(#dots)"/>
<rect x="24" y="24" width="1552" height="852" fill="none" stroke="#2c3036" stroke-width="2"/>
<path d="M24 64 V24 H64" fill="none" stroke="#7fa8d6" stroke-width="4"/>
<path d="M1536 876 H1576 V836" fill="none" stroke="#7fa8d6" stroke-width="4"/>
<text x="64" y="84" font-size="16" fill="#7fa8d6" font-family="DejaVu Sans Mono, monospace">04</text>
<text x="104" y="86" font-size="34" font-weight="bold" fill="#e3e5e8">Media pipeline: look and speech</text>
<text x="64" y="120" font-size="17" fill="#8f949c">Photos, PDF pages and video frames in one SigLIP 2 space. Audio and video speech through Whisper.</text>
<text x="1536" y="856" font-size="14" fill="#5d6168" text-anchor="end">RAVEN · pipelines</text>
<rect x="1454" y="58" width="14" height="14" fill="#8dbf93"/><text x="1474" y="70" font-size="13.5" fill="#8f949c">result</text><rect x="1324" y="58" width="14" height="14" fill="#e5736a"/><text x="1344" y="70" font-size="13.5" fill="#8f949c">safety check</text><rect x="1202" y="58" width="14" height="14" fill="#d9b26a"/><text x="1222" y="70" font-size="13.5" fill="#8f949c">stored data</text><rect x="1104" y="58" width="14" height="14" fill="#b48ead"/><text x="1124" y="70" font-size="13.5" fill="#8f949c">AI model</text><rect x="1038" y="58" width="14" height="14" fill="#7fa8d6"/><text x="1058" y="70" font-size="13.5" fill="#8f949c">step</text>
<path d="M364 265 L397 265 L397 265 L430 265" fill="none" stroke="#7fa8d6" stroke-width="2.2" marker-end="url(#arr)"/><path d="M730 265 L765 265 L765 265 L800 265" fill="none" stroke="#7fa8d6" stroke-width="2.2" marker-end="url(#arr)"/><path d="M1060 435 L1090 435 L1090 435 L1120 435" fill="none" stroke="#7fa8d6" stroke-width="2.2" marker-end="url(#arr)"/><path d="M1230 490 L1230 340 L1330 340 L1330 190" fill="none" stroke="#7fa8d6" stroke-width="2.2" marker-end="url(#arr)"/><path d="M1060 265 L1090 265 L1090 265 L1120 265" fill="none" stroke="#7fa8d6" stroke-width="2.2" marker-end="url(#arr)"/><path d="M364 625 L397 625 L397 625 L430 625" fill="none" stroke="#7fa8d6" stroke-width="2.2" marker-end="url(#arr)"/><path d="M690 625 L720 625 L720 625 L750 625" fill="none" stroke="#7fa8d6" stroke-width="2.2" marker-end="url(#arr)"/><path d="M1030 625 L1060 625 L1060 625 L1090 625" fill="none" stroke="#7fa8d6" stroke-width="2.2" marker-end="url(#arr)"/><path d="M1310 625 L1335 625 L1335 625 L1360 625" fill="none" stroke="#7fa8d6" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="64" y="175" font-size="16" fill="#b48ead" text-anchor="start">BY LOOK</text><rect x="64" y="190" width="300" height="150" fill="#1d2024" stroke="#c9ccd1" stroke-width="2"/><rect x="64" y="190" width="5" height="150" fill="#c9ccd1"/><text x="82" y="218" font-size="18" font-weight="bold" fill="#e3e5e8">Sources</text><text x="82" y="242" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">photos, screenshots</text><text x="82" y="263" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">PDF pages (max 40)</text><text x="82" y="284" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">video keyframes ≥ 2 s apart</text><text x="82" y="305" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">(max 300, same frames dropped)</text><rect x="430" y="190" width="300" height="150" fill="#1d2024" stroke="#b48ead" stroke-width="2"/><rect x="430" y="190" width="5" height="150" fill="#b48ead"/><text x="448" y="218" font-size="18" font-weight="bold" fill="#e3e5e8">SigLIP 2 vision</text><text x="448" y="242" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">224 × 224, no crop</text><text x="448" y="263" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">fp32 ONNX on the CPU</text><text x="448" y="284" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">unloads after 90 s</text><rect x="800" y="190" width="260" height="150" fill="#1d2024" stroke="#d9b26a" stroke-width="2"/><rect x="800" y="190" width="5" height="150" fill="#d9b26a"/><text x="818" y="218" font-size="18" font-weight="bold" fill="#e3e5e8">visual_vec</text><text x="818" y="242" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">768-d per image,</text><text x="818" y="263" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">page or frame</text><text x="818" y="284" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">+ the second</text><rect x="800" y="380" width="260" height="110" fill="#1d2024" stroke="#c9ccd1" stroke-width="2"/><rect x="800" y="380" width="5" height="110" fill="#c9ccd1"/><text x="818" y="408" font-size="18" font-weight="bold" fill="#e3e5e8">Text query</text><text x="818" y="432" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">&quot;a big rabbit</text><text x="818" y="453" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">in a forest&quot;</text><rect x="1120" y="380" width="220" height="110" fill="#1d2024" stroke="#b48ead" stroke-width="2"/><rect x="1120" y="380" width="5" height="110" fill="#b48ead"/><text x="1138" y="408" font-size="18" font-weight="bold" fill="#e3e5e8">SigLIP 2 text</text><text x="1138" y="432" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">int8, 64 tokens</text><rect x="1120" y="190" width="420" height="150" fill="#1d2024" stroke="#8dbf93" stroke-width="2"/><rect x="1120" y="190" width="5" height="150" fill="#8dbf93"/><text x="1138" y="218" font-size="18" font-weight="bold" fill="#e3e5e8">A moment</text><text x="1138" y="242" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">big_buck_bunny.mp4 at 4:57</text><text x="1138" y="263" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">opens at that second, with</text><text x="1138" y="284" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">a strip of 5 keyframes</text><rect x="1220" y="327" width="120" height="22" fill="#17191c"/><text x="1280" y="343" text-anchor="middle" font-size="13.5" fill="#7fa8d6">cosine ≥ 0.075</text><text x="64" y="545" font-size="16" fill="#b48ead" text-anchor="start">BY SPEECH</text><rect x="64" y="560" width="300" height="130" fill="#1d2024" stroke="#c9ccd1" stroke-width="2"/><rect x="64" y="560" width="5" height="130" fill="#c9ccd1"/><text x="82" y="588" font-size="18" font-weight="bold" fill="#e3e5e8">Audio and video</text><text x="82" y="612" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">MP3 M4A WAV OGG Opus</text><text x="82" y="633" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">MP4 MKV WEBM MOV, ≤ 3 h</text><rect x="430" y="560" width="260" height="130" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="430" y="560" width="5" height="130" fill="#7fa8d6"/><text x="448" y="588" font-size="18" font-weight="bold" fill="#e3e5e8">ffmpeg</text><text x="448" y="612" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">mono 16 kHz PCM</text><text x="448" y="633" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">no PyAV</text><rect x="750" y="560" width="280" height="130" fill="#1d2024" stroke="#b48ead" stroke-width="2"/><rect x="750" y="560" width="5" height="130" fill="#b48ead"/><text x="768" y="588" font-size="18" font-weight="bold" fill="#e3e5e8">Whisper base</text><text x="768" y="612" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">faster-whisper int8</text><text x="768" y="633" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">timed segments</text><rect x="1090" y="560" width="220" height="130" fill="#1d2024" stroke="#d9b26a" stroke-width="2"/><rect x="1090" y="560" width="5" height="130" fill="#d9b26a"/><text x="1108" y="588" font-size="18" font-weight="bold" fill="#e3e5e8">Chunks</text><text x="1108" y="612" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">~90 words</text><text x="1108" y="633" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">+ start time</text><rect x="1360" y="560" width="180" height="130" fill="#1d2024" stroke="#8dbf93" stroke-width="2"/><rect x="1360" y="560" width="5" height="130" fill="#8dbf93"/><text x="1378" y="588" font-size="18" font-weight="bold" fill="#e3e5e8">Find + Ask</text><text x="1378" y="612" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">said at 0:02</text><text x="1378" y="633" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">cite the moment</text><text x="64" y="760" font-size="15" fill="#8f949c" text-anchor="start">Speech chunks go through BM25, embeddings and PII detection like any document. Music with no speech is marked, so it is not read again.</text><text x="64" y="786" font-size="15" fill="#8f949c" text-anchor="start">Find similar: the mean vector of a file (a video: its keyframes) is the query, similarity ≥ 0.62.</text>
</svg>
