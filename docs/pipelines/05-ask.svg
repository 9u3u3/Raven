 fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">words ≥ 50%</text><rect x="1360" y="200" width="180" height="130" fill="#1d2024" stroke="#8dbf93" stroke-width="2"/><rect x="1360" y="200" width="5" height="130" fill="#8dbf93"/><text x="1378" y="228" font-size="18" font-weight="bold" fill="#e3e5e8">Not found</text><text x="1378" y="252" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">&quot;I did not find</text><text x="1378" y="273" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">this in your</text><text x="1378" y="294" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">files.&quot;</text><rect x="1060" y="400" width="240" height="130" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="1060" y="400" width="5" height="130" fill="#7fa8d6"/><text x="1078" y="428" font-size="18" font-weight="bold" fill="#e3e5e8">Parent context</text><text x="1078" y="452" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">neighbor chunks of</text><text x="1078" y="473" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">the same section</text><rect x="700" y="400" width="300" height="130" fill="#1d2024" stroke="#b48ead" stroke-width="2"/><rect x="700" y="400" width="5" height="130" fill="#b48ead"/><text x="718" y="428" font-size="18" font-weight="bold" fill="#e3e5e8">T2 local</text><text x="718" y="452" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">qwen3:4b · 4 sources</text><text x="718" y="473" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">JSON {answer, sources}</text><text x="718" y="494" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">streamed</text><rect x="700" y="590" width="300" height="130" fill="#1d2024" stroke="#e5736a" stroke-width="2"/><rect x="700" y="590" width="5" height="130" fill="#e5736a"/><text x="718" y="618" font-size="18" font-weight="bold" fill="#e3e5e8">T3 cloud (Think harder)</text><text x="718" y="642" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">10 sources, 6000 tokens</text><text x="718" y="663" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">after the redaction gate</text><rect x="380" y="480" width="260" height="130" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="380" y="480" width="5" height="130" fill="#7fa8d6"/><text x="398" y="508" font-size="18" font-weight="bold" fill="#e3e5e8">Restore</text><text x="398" y="532" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">placeholders back</text><text x="398" y="553" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">to real values,</text><text x="398" y="574" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">on the laptop</text><rect x="64" y="480" width="260" height="150" fill="#1d2024" stroke="#8dbf93" stroke-width="2"/><rect x="64" y="480" width="5" height="150" fill="#8dbf93"/><text x="82" y="508" font-size="18" font-weight="bold" fill="#e3e5e8">Answer</text><text x="82" y="532" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">&quot;Rs 500 for each day</text><text x="82" y="553" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">of delay [1]&quot;</text><text x="82" y="574" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">click [1]: the PDF</text><text x="82" y="595" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">opens at the page</text><rect x="1315" y="252" width="29" height="22" fill="#17191c"/><text x="1330" y="268" text-anchor="middle" font-size="13.5" fill="#e5736a">no</text><rect x="1162" y="352" width="37" height="22" fill="#17191c"/><text x="1180" y="368" text-anchor="middle" font-size="13.5" fill="#8dbf93">yes</text><text x="64" y="780" font-size="15" fill="#8f949c" text-anchor="start">A short follow-up (&quot;and the deposit?&quot;) borrows the words of the earlier question. Lite mode: the best sentence of each source, with [n].</text><text x="64" y="806" font-size="15" fill="#7fa8d6" text-anchor="start">12 test questions: the right source in all 12, &quot;not found&quot; for the 2 that have no answer.</text>
