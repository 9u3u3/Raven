<rect x="64" y="210" width="280" height="120" fill="#1d2024" stroke="#c9ccd1" stroke-width="2"/><rect x="64" y="210" width="5" height="120" fill="#c9ccd1"/><text x="82" y="238" font-size="18" font-weight="bold" fill="#e3e5e8">Command</text><text x="82" y="262" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">&quot;please, in Downloads</text><text x="82" y="283" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">move all pdfs to Papers&quot;</text><rect x="400" y="210" width="280" height="130" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="400" y="210" width="5" height="130" fill="#7fa8d6"/><text x="418" y="238" font-size="18" font-weight="bold" fill="#e3e5e8">Normalize</text><text x="418" y="262" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">drop polite words</text><text x="418" y="283" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">a place said first</text><text x="418" y="304" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">goes to its place</text><rect x="740" y="210" width="260" height="130" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="740" y="210" width="5" height="130" fill="#7fa8d6"/><text x="758" y="238" font-size="18" font-weight="bold" fill="#e3e5e8">Grammar</text><text x="758" y="262" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">no model, fast</text><text x="758" y="283" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">find · convert · move</text><text x="758" y="304" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">copy · rename · mkdir …</text><rect x="740" y="400" width="260" height="120" fill="#1d2024" stroke="#b48ead" stroke-width="2"/><rect x="740" y="400" width="5" height="120" fill="#b48ead"/><text x="758" y="428" font-size="18" font-weight="bold" fill="#e3e5e8">Local LLM</text><text x="758" y="452" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">qwen3:4b, JSON</text><text x="758" y="473" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">schema of 10 ops</text><rect x="740" y="580" width="260" height="130" fill="#1d2024" stroke="#e5736a" stroke-width="2"/><rect x="740" y="580" width="5" height="130" fill="#e5736a"/><text x="758" y="608" font-size="18" font-weight="bold" fill="#e3e5e8">Cloud (Think harder)</text><text x="758" y="632" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">redacted context only:</text><text x="758" y="653" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">folder names, types</text><rect x="1060" y="300" width="240" height="160" fill="#1d2024" stroke="#e5736a" stroke-width="2"/><rect x="1060" y="300" width="5" height="160" fill="#e5736a"/><text x="1078" y="328" font-size="18" font-weight="bold" fill="#e3e5e8">Resolve + limits</text><text x="1078" y="352" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">paths resolved locally</text><text x="1078" y="373" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">≤ 20 steps, ≤ 2000 files</text><text x="1078" y="394" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">no system folders</text><text x="1078" y="415" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">no shell tool</text><rect x="1360" y="210" width="180" height="140" fill="#1d2024" stroke="#c9ccd1" stroke-width="2"/><rect x="1360" y="210" width="5" height="140" fill="#c9ccd1"/><text x="1378" y="238" font-size="18" font-weight="bold" fill="#e3e5e8">Review</text><text x="1378" y="262" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">every step</text><text x="1378" y="283" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">shown first;</text><text x="1378" y="304" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">trash: 2nd OK</text><rect x="1360" y="420" width="180" height="130" fill="#1d2024" stroke="#8dbf93" stroke-width="2"/><rect x="1360" y="420" width="5" height="130" fill="#8dbf93"/><text x="1378" y="448" font-size="18" font-weight="bold" fill="#e3e5e8">Run</text><text x="1378" y="472" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">one journal</text><text x="1378" y="493" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">group</text><rect x="1360" y="610" width="180" height="110" fill="#1d2024" stroke="#8dbf93" stroke-width="2"/><rect x="1360" y="610" width="5" height="110" fill="#8dbf93"/><text x="1378" y="638" font-size="18" font-weight="bold" fill="#e3e5e8">Ctrl+Z</text><text x="1378" y="662" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">reverts all</text><text x="1378" y="683" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">steps</text><rect x="833" y="357" width="75" height="22" fill="#17191c"/><text x="870" y="373" text-anchor="middle" font-size="13.5" fill="#7fa8d6">no match</text><rect x="817" y="537" width="105" height="22" fill="#17191c"/><text x="870" y="553" text-anchor="middle" font-size="13.5" fill="#7fa8d6">Think harder</text><text x="64" y="790" font-size="15" fill="#8f949c" text-anchor="start">The command bar picks Act by itself: &quot;in desktop make a folder called notes&quot; → mkdir notes in Desktop. &quot;copy of trip photo&quot; stays a search.</text>
</svg>
