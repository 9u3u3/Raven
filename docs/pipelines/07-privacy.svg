<text x="104" y="86" font-size="34" font-weight="bold" fill="#e3e5e8">Privacy: the router and the redaction gate</text>
<text x="64" y="120" font-size="17" fill="#8f949c">The cloud only for hard tasks, only in Hybrid, only after on-device redaction. Every byte is in the ledger.</text>
