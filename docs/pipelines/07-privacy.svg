<rect x="64" y="200" width="240" height="110" fill="#1d2024" stroke="#c9ccd1" stroke-width="2"/><rect x="64" y="200" width="5" height="110" fill="#c9ccd1"/><text x="82" y="228" font-size="18" font-weight="bold" fill="#e3e5e8">A task</text><text x="82" y="252" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">Ask · summary ·</text><text x="82" y="273" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">organize · plan</text><rect x="360" y="180" width="300" height="160" fill="#1d2024" stroke="#e5736a" stroke-width="2"/><rect x="360" y="180" width="5" height="160" fill="#e5736a"/><text x="378" y="208" font-size="18" font-weight="bold" fill="#e3e5e8">Router: 4 conditions</text><text x="378" y="232" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">1 heavy, or Think harder</text><text x="378" y="253" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">2 mode allows the cloud</text><text x="378" y="274" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">3 a provider is set</text><text x="378" y="295" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">4 the gate passes</text><rect x="360" y="420" width="300" height="110" fill="#1d2024" stroke="#b48ead" stroke-width="2"/><rect x="360" y="420" width="5" height="110" fill="#b48ead"/><text x="378" y="448" font-size="18" font-weight="bold" fill="#e3e5e8">T2 local</text><text x="378" y="472" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">qwen3:4b · nothing leaves</text><rect x="720" y="180" width="260" height="110" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="720" y="180" width="5" height="110" fill="#7fa8d6"/><text x="738" y="208" font-size="18" font-weight="bold" fill="#e3e5e8">Minimum payload</text><text x="738" y="232" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">passages, not files</text><rect x="720" y="330" width="260" height="130" fill="#1d2024" stroke="#e5736a" stroke-width="2"/><rect x="720" y="330" width="5" height="130" fill="#e5736a"/><text x="738" y="358" font-size="18" font-weight="bold" fill="#e3e5e8">Layer 1</text><text x="738" y="382" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">patterns + checksums</text><text x="738" y="403" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">PAN · Aadhaar (Verhoeff)</text><text x="738" y="424" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">cards (Luhn) · IBAN</text><rect x="720" y="500" width="260" height="120" fill="#1d2024" stroke="#b48ead" stroke-width="2"/><rect x="720" y="500" width="5" height="120" fill="#b48ead"/><text x="738" y="528" font-size="18" font-weight="bold" fill="#e3e5e8">Layer 2</text><text x="738" y="552" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">OpenAI Privacy Filter</text><text x="738" y="573" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">q4 ONNX, 8 types</text><rect x="1040" y="180" width="240" height="110" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="1040" y="180" width="5" height="110" fill="#7fa8d6"/><text x="1058" y="208" font-size="18" font-weight="bold" fill="#e3e5e8">Placeholders</text><text x="1058" y="232" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">[PERSON_1]</text><text x="1058" y="253" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">[ACCOUNT_1]</text><rect x="1040" y="330" width="240" height="130" fill="#1d2024" stroke="#e5736a" stroke-width="2"/><rect x="1040" y="330" width="5" height="130" fill="#e5736a"/><text x="1058" y="358" font-size="18" font-weight="bold" fill="#e3e5e8">Final check</text><text x="1058" y="382" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">layer 1 again</text><text x="1058" y="403" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">high risk left:</text><text x="1058" y="424" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">BLOCK</text><rect x="1040" y="500" width="240" height="120" fill="#1d2024" stroke="#d9b26a" stroke-width="2"/><rect x="1040" y="500" width="5" height="120" fill="#d9b26a"/><text x="1058" y="528" font-size="18" font-weight="bold" fill="#e3e5e8">Ledger</text><text x="1058" y="552" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">exact payload,</text><text x="1058" y="573" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">bytes, provider</text><rect x="1330" y="180" width="210" height="130" fill="#1d2024" stroke="#8dbf93" stroke-width="2"/><rect x="1330" y="180" width="5" height="130" fill="#8dbf93"/><text x="1348" y="208" font-size="18" font-weight="bold" fill="#e3e5e8">Provider</text><text x="1348" y="232" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">Groq · Anthropic</text><text x="1348" y="253" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">claude -p</text><rect x="1330" y="400" width="210" height="130" fill="#1d2024" stroke="#8dbf93" stroke-width="2"/><rect x="1330" y="400" width="5" height="130" fill="#8dbf93"/><text x="1348" y="428" font-size="18" font-weight="bold" fill="#e3e5e8">Restore</text><text x="1348" y="452" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">real values back</text><text x="1348" y="473" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">in the answer,</text><text x="1348" y="494" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">on the laptop</text><rect x="480" y="367" width="60" height="22" fill="#17191c"/><text x="510" y="383" text-anchor="middle" font-size="13.5" fill="#8dbf93">any no</text><rect x="656" y="234" width="67" height="22" fill="#17191c"/><text x="690" y="250" text-anchor="middle" font-size="13.5" fill="#e5736a">all yes</text><text x="64" y="690" font-size="15" fill="#8f949c" text-anchor="start">Also: Ask each time shows the payload first · folder rule &quot;Never to the cloud&quot; · encrypted index (SQLCipher) ·</text><text x="64" y="714" font-size="15" fill="#8f949c" text-anchor="start">egress guard in the app · MCP answers pass the same gate · offline: LOCAL ONLY.</text><text x="64" y="760" font-size="16" fill="#7fa8d6" text-anchor="start">PII recall on 60 test documents: layer 1 91% · layer 2 98% · both 99%.</text>
