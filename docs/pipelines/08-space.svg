<rect x="64" y="190" width="280" height="150" fill="#1d2024" stroke="#d9b26a" stroke-width="2"/><rect x="64" y="190" width="5" height="150" fill="#d9b26a"/><text x="82" y="218" font-size="18" font-weight="bold" fill="#e3e5e8">Scan</text><text x="82" y="242" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">one walk per drive</text><text x="82" y="263" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">sizes per category</text><text x="82" y="284" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">and age, largest files</text><rect x="400" y="170" width="300" height="190" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="400" y="170" width="5" height="190" fill="#7fa8d6"/><text x="418" y="198" font-size="18" font-weight="bold" fill="#e3e5e8">Reclaim rows</text><text x="418" y="222" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">caches · trash · junk</text><text x="418" y="243" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">large old files</text><text x="418" y="264" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">extracted archives</text><text x="418" y="285" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">duplicate folders</text><text x="418" y="306" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">two formats · Docker</text><rect x="400" y="400" width="300" height="160" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="400" y="400" width="5" height="160" fill="#7fa8d6"/><text x="418" y="428" font-size="18" font-weight="bold" fill="#e3e5e8">Duplicates</text><text x="418" y="452" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">size → quick hash</text><text x="418" y="473" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">(64 KB) → BLAKE3</text><text x="418" y="494" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">photos: pHash ≤ 6 bits</text><text x="418" y="515" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">+ color check</text><rect x="760" y="190" width="260" height="150" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="760" y="190" width="5" height="150" fill="#7fa8d6"/><text x="778" y="218" font-size="18" font-weight="bold" fill="#e3e5e8">Plan</text><text x="778" y="242" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">&quot;Free 10 GB&quot;:</text><text x="778" y="263" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">safe rows first,</text><text x="778" y="284" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">reversible first</text><rect x="1080" y="190" width="220" height="150" fill="#1d2024" stroke="#c9ccd1" stroke-width="2"/><rect x="1080" y="190" width="5" height="150" fill="#c9ccd1"/><text x="1098" y="218" font-size="18" font-weight="bold" fill="#e3e5e8">Review</text><text x="1098" y="242" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">flags: safe,</text><text x="1098" y="263" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">check, permanent,</text><text x="1098" y="284" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">admin</text><rect x="1360" y="190" width="180" height="150" fill="#1d2024" stroke="#8dbf93" stroke-width="2"/><rect x="1360" y="190" width="5" height="150" fill="#8dbf93"/><text x="1378" y="218" font-size="18" font-weight="bold" fill="#e3e5e8">Act</text><text x="1378" y="242" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">trash · delete</text><text x="1378" y="263" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">compress ·</text><text x="1378" y="284" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">optimize</text><text x="64" y="625" font-size="16" fill="#d9b26a" text-anchor="start">SAFE COMPRESSION</text><rect x="64" y="640" width="220" height="120" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="64" y="640" width="5" height="120" fill="#7fa8d6"/><text x="82" y="668" font-size="18" font-weight="bold" fill="#e3e5e8">Plan</text><text x="82" y="692" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">7z · tar.zst · zip</text><text x="82" y="713" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">zstd · JPEG XL</text><rect x="312" y="640" width="220" height="120" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="312" y="640" width="5" height="120" fill="#7fa8d6"/><text x="330" y="668" font-size="18" font-weight="bold" fill="#e3e5e8">Space check</text><text x="330" y="692" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">enough free</text><text x="330" y="713" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">space first</text><rect x="560" y="640" width="220" height="120" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="560" y="640" width="5" height="120" fill="#7fa8d6"/><text x="578" y="668" font-size="18" font-weight="bold" fill="#e3e5e8">Create</text><text x="578" y="692" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">+ manifest</text><text x="578" y="713" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">inside</text><rect x="808" y="640" width="220" height="120" fill="#1d2024" stroke="#e5736a" stroke-width="2"/><rect x="808" y="640" width="5" height="120" fill="#e5736a"/><text x="826" y="668" font-size="18" font-weight="bold" fill="#e3e5e8">Test</text><text x="826" y="692" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">extract to temp</text><text x="826" y="713" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">BLAKE3 each file</text><rect x="1056" y="640" width="220" height="120" fill="#1d2024" stroke="#7fa8d6" stroke-width="2"/><rect x="1056" y="640" width="5" height="120" fill="#7fa8d6"/><text x="1074" y="668" font-size="18" font-weight="bold" fill="#e3e5e8">Trash originals</text><text x="1074" y="692" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">only if all</text><text x="1074" y="713" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">hashes match</text><rect x="1304" y="640" width="220" height="120" fill="#1d2024" stroke="#8dbf93" stroke-width="2"/><rect x="1304" y="640" width="5" height="120" fill="#8dbf93"/><text x="1322" y="668" font-size="18" font-weight="bold" fill="#e3e5e8">Restore</text><text x="1322" y="692" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">hash check, then</text><text x="1322" y="713" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">times and modes</text><text x="64" y="820" font-size="15" fill="#8f949c" text-anchor="start">Lossy (AVIF, lossy JPEG XL, H.265): Suggest mode only, &quot;Not reversible&quot;, same pixels and length checked. Auto mode never uses it.</text>
</svg>
