 font-size="18" font-weight="bold" fill="#e3e5e8">Local LLM</text><text x="982" y="242" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">10 files per call</text><text x="982" y="263" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">name + text start</text><rect x="902" y="234" width="75" height="22" fill="#17191c"/><text x="939" y="250" text-anchor="middle" font-size="13.5" fill="#7fa8d6">not sure</text><rect x="1280" y="190" width="260" height="115" fill="#1d2024" stroke="#8dbf93" stroke-width="2"/><rect x="1280" y="190" width="5" height="115" fill="#8dbf93"/><text x="1298" y="218" font-size="18" font-weight="bold" fill="#e3e5e8">Plan a folder</text><text x="1298" y="242" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">before and after</text><text x="1298" y="263" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">trees</text><rect x="1280" y="360" width="260" height="130" fill="#1d2024" stroke="#c9ccd1" stroke-width="2"/><rect x="1280" y="360" width="5" height="130" fill="#c9ccd1"/><text x="1298" y="388" font-size="18" font-weight="bold" fill="#e3e5e8">You edit</text><text x="1298" y="412" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">uncheck, drag,</text><text x="1298" y="433" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">rename in place</text><rect x="1280" y="540" width="260" height="110" fill="#1d2024" stroke="#8dbf93" stroke-width="2"/><rect x="1280" y="540" width="5" height="110" fill="#8dbf93"/><text x="1298" y="568" font-size="18" font-weight="bold" fill="#e3e5e8">Apply</text><text x="1298" y="592" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">one journal group</text><rect x="930" y="560" width="290" height="120" fill="#1d2024" stroke="#d9b26a" stroke-width="2"/><rect x="930" y="560" width="5" height="120" fill="#d9b26a"/><text x="948" y="588" font-size="18" font-weight="bold" fill="#e3e5e8">Learn</text><text x="948" y="612" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">kept folders per category</text><text x="948" y="633" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">3 same moves → a rule</text><text x="64" y="395" font-size="16" fill="#b48ead" text-anchor="start">NAMES FOR UNNAMED FILES</text><rect x="64" y="415" width="260" height="135" fill="#1d2024" stroke="#e5736a" stroke-width="2"/><rect x="64" y="415" width="5" height="135" fill="#e5736a"/><text x="82" y="443" font-size="18" font-weight="bold" fill="#e3e5e8">Generic name?</text><text x="82" y="467" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">IMG_2044, Untitled,</text><text x="82" y="488" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">Book1, a hash</text><rect x="354" y="415" width="260" height="135" fill="#1d2024" stroke="#b48ead" stroke-width="2"/><rect x="354" y="415" width="5" height="135" fill="#b48ead"/><text x="372" y="443" font-size="18" font-weight="bold" fill="#e3e5e8">Best source</text><text x="372" y="467" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">PDF title (largest text)</text><text x="372" y="488" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">OCR · SigLIP label</text><text x="372" y="509" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">transcript · local LLM</text><rect x="644" y="415" width="260" height="135" fill="#1d2024" stroke="#d9b26a" stroke-width="2"/><rect x="644" y="415" width="5" height="135" fill="#d9b26a"/><text x="662" y="443" font-size="18" font-weight="bold" fill="#e3e5e8">Your style</text><text x="662" y="467" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">date place, case,</text><text x="662" y="488" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">separator</text><rect x="64" y="610" width="780" height="90" fill="#1d2024" stroke="#8dbf93" stroke-width="2"/><rect x="64" y="610" width="5" height="90" fill="#8dbf93"/><text x="82" y="638" font-size="18" font-weight="bold" fill="#e3e5e8">Review → rename as one group</text><text x="82" y="662" font-size="14.5" fill="#a9aeb6" font-family="DejaVu Sans Mono, monospace">1706.03762.pdf → Attention Is All You Need.pdf · photo (4).jpg → Receipt.jpg</text><text x="64" y="770" font-size="15" fill="#8f949c" text-anchor="start">Watch rules: move or name new files in a folder by category, extension or name, once each file is stable for 20 s. Each run has one undo.</text>
